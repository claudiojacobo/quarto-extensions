# A page that uses every styled feature of the extensions, rendered before and
# after a change to the stylesheets, so the two renders can be compared
# (computed colors in light and dark mode, and the PDF page by page).
# _extensions is a link to the repo's own extensions, so this always renders
# with the working copy.
#
#   cd tools/sample && quarto render                    # cjgg    -> _site/
#   cd tools/sample && quarto render --profile mathkit  # mathkit -> _site-mathkit/
project:
  type: default
  output-dir: _site
profile:
  default: cjgg
